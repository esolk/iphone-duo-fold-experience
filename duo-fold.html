<script>document.addEventListener('DOMContentLoaded', () => {
'use strict';

// Both displays sample a stationary image plane. The housing is a pair of
// rounded, extruded solids; UI is composited before the spatial frost pass.
window.FoldRenderer = class FoldRenderer {
  constructor(gl) {
    this.gl = gl;
    this.lastComposite = '';
    const vertex = `attribute vec2 aPosition; varying vec2 vUV;
      void main(){vUV=aPosition*.5+.5;gl_Position=vec4(aPosition,0.,1.);}`;
    const media = `
      uniform sampler2D uVideo;
      uniform float uUseVideo,uTime,uAspect,uContain;
      vec3 demo(vec2 p){
        float t=uTime*.13;
        float wave=p.x*.76+p.y*.33+.19*sin(p.y*3.7+t);
        float ribbon=sin(wave*7.4-t)*.5+.5;
        vec3 c=mix(vec3(.055,.075,.25),vec3(.29,.60,.84),smoothstep(.08,.64,ribbon));
        c=mix(c,vec3(1.,.49,.30),smoothstep(.59,.9,ribbon));
        c=mix(c,vec3(1.,.82,.60),pow(ribbon,10.)*.95);
        c*=.69+.31*smoothstep(0.,.5,.5+.5*sin(wave*19.+p.y*1.4-t));
        return c+vec3(.025,.03,.06)*sin(p.y*3.);
      }
      vec3 wallpaper(vec2 uv,float displayAspect){
        if(uUseVideo<.5)return demo(uv);
        vec2 p=uv-.5;float ratio=displayAspect/uAspect;
        if(uContain>.5){if(ratio>1.)p.x*=ratio;else p.y/=ratio;}
        else{if(ratio>1.)p.y/=ratio;else p.x*=ratio;}
        vec3 color=texture2D(uVideo,clamp(p+.5,0.,1.)).rgb;
        if(uContain>.5&&(abs(p.x)>.5||abs(p.y)>.5))color=vec3(.006);
        return color;
      }`;
    const scene = `precision highp float;
      ${media}
      uniform vec2 uResolution;
      uniform float uScale,uAngle,uEffect;
      uniform sampler2D uInner,uOuter,uHUDInner,uHUDOuter;
      const float W=250.;
      const float H=357.142857;
      const float T=8.;
      const float B=8.;
      const float R=31.;
      const float CAMERA=1600.;
      float box(vec2 p,vec2 b,float r){vec2 d=abs(p)-b+r;return min(max(d.x,d.y),0.)+length(max(d,0.))-r;}
      float shape(vec2 p,float inset,bool continuous){
        float radius=p.x>W*.5?R:1.2;
        float d=box(p-vec2(W*.5,0.),vec2(W*.5-inset,H*.5-inset),max(.1,radius-inset));
        // A continuous display has no vertical mask or bezel along its hinge.
        if(continuous&&p.x<W*.5)d=abs(p.y)-(H*.5-inset);
        return d;
      }
      vec3 clearContent(vec2 uv,bool outer){
        vec3 color=wallpaper(uv,outer?(W-2.*B)/(H-2.*B):(2.*W-2.*B)/(H-2.*B));
        vec4 hud;
        if(outer)hud=texture2D(uHUDOuter,uv);else hud=texture2D(uHUDInner,uv);
        return mix(color,hud.rgb,hud.a);
      }
      vec3 content(vec2 uv,bool outer,float blur){
        // Endpoints sample the original video and high-resolution vector HUD.
        // They never pass through the lower-resolution frosted image pyramid.
        if(blur<.00001)return clearContent(uv,outer);
        float naturalLod=log2(max(1.,1024./((H-2.*B)*uScale)));
        float lod=log2(max(1.,blur*1024.))-naturalLod;
        vec2 delta=vec2(blur*(outer?1.46:.70),blur)*.36;
        if(outer){
          vec3 c=texture2D(uOuter,uv,lod).rgb*.4;
          c+=(texture2D(uOuter,uv+vec2(delta.x,0.),lod).rgb+texture2D(uOuter,uv-vec2(delta.x,0.),lod).rgb)*.15;
          c+=(texture2D(uOuter,uv+vec2(0.,delta.y),lod).rgb+texture2D(uOuter,uv-vec2(0.,delta.y),lod).rgb)*.15;
          if(blur<.0015)c=mix(clearContent(uv,true),c,smoothstep(0.,.0015,blur));
          return c;
        }
        vec3 c=texture2D(uInner,uv,lod).rgb*.4;
        c+=(texture2D(uInner,uv+vec2(delta.x,0.),lod).rgb+texture2D(uInner,uv-vec2(delta.x,0.),lod).rgb)*.15;
        c+=(texture2D(uInner,uv+vec2(0.,delta.y),lod).rgb+texture2D(uInner,uv-vec2(0.,delta.y),lod).rgb)*.15;
        if(blur<.0015)c=mix(clearContent(uv,false),c,smoothstep(0.,.0015,blur));
        return c;
      }
      vec3 face(vec2 p,vec3 world,bool moving,bool outer,float sn){
        bool continuous=!outer;
        float edge=shape(p,0.,continuous);
        float rimLight=.43+.20*cos(p.y/H*5.+p.x/W*1.5);
        vec3 metal=vec3(.87,.92,1.)*rimLight;
        // Thin polished lip and graphite glass border, measured from the video.
        vec3 color=metal;
        if(edge< -.85)color=vec3(.10,.115,.13)+vec3(.13)*exp(-pow((edge+1.8)*1.1,2.));
        if(edge< -2.8)color=vec3(.015,.018,.021);
        float se=shape(p,B,continuous);
        float aa=.7/uScale;
        if(se<aa){
          vec2 projectedPoint=world.xy*CAMERA/(CAMERA-world.z);
          vec2 halfSize=outer?vec2(W*.5-B,H*.5-B):vec2(W-B,H*.5-B);
          vec2 origin=outer?vec2(W*.5,0.):vec2(0.);
          vec2 localImage=outer?vec2(p.x-W*.5,p.y):vec2(moving?-p.x:p.x,p.y);
          float opening=abs(sn);
          // The back surface has physical depth; suppress its tiny perspective
          // offset at closure so the settled cover fills the display exactly.
          float projection=uEffect*(outer?smoothstep(0.,.035,opening):1.);
          vec2 imagePoint=mix(localImage,projectedPoint-origin,projection);
          vec2 uv=imagePoint/(2.*halfSize)*vec2(1.,-1.)+.5;
          float angleBlur=pow(opening,.8)*smoothstep(0.,.04,opening);
          // Linear in distance from the hinge, in display space (not UV space).
          float blur=moving?uEffect*.045*angleBlur*clamp(p.x/W,0.,1.):0.;
          vec3 picture=content(clamp(uv,0.,1.),outer,blur);
          // Anchor the lateral mask to the glass. A stationary x cutoff pulls
          // away from the hinge as the thick cover rotates, creating a gap.
          vec2 maskPoint=vec2(localImage.x,imagePoint.y);
          float imageRadius=outer?(maskPoint.x<0.?1.:R-B):R-B;
          float projectionEdge=box(maskPoint,halfSize,imageRadius);
          // Frost diffuses picture light into the projected dark margin. Its
          // mask has the same spatial blur footprint as the image, rather than
          // cutting the already-blurred image off with a sharp black polygon.
          float diffusion=max(.65,blur*(H-2.*B)*2.6);
          float projectionMask=1.-smoothstep(-diffusion,diffusion,projectionEdge);
          picture*=projectionMask;
          float glass=blur/.045;
          picture=mix(picture,picture*.89+vec3(.055,.06,.065)*projectionMask,glass*.40);
          // Smooth, restrained edge shading remains inside the projected image.
          float sideShade=moving?.18*uEffect*angleBlur*pow(p.x/W,2.):0.;
          picture*=1.-sideShade;
          color=mix(color,picture,1.-smoothstep(-aa,aa,se));
          if(outer){
            // This is physical hardware, so the camera never enters the blur pass.
            vec2 lens=p-vec2(W-31.,H*.5-31.);
            float d=length(lens);
            vec3 lensColor=vec3(.008,.010,.014);
            lensColor+=vec3(.025,.033,.055)*exp(-pow((d-3.7)*.8,2.));
            lensColor+=vec3(.065,.078,.115)*exp(-dot(lens-vec2(-1.7,2.0),lens-vec2(-1.7,2.0))*.6);
            color=mix(color,lensColor,1.-smoothstep(8.5,9.1,d));
          }
        }
        return color;
      }
      vec3 side(vec3 p,vec3 n,bool moving){
        float depth=clamp(-p.z/T,0.,1.);
        float band=.14+.32*pow(.5+.5*cos(depth*6.283-1.2),3.);
        band+=.32*exp(-pow((depth-.10)*25.,2.));
        band+=.22*exp(-pow((depth-.90)*24.,2.));
        float reflect=.55+.45*abs(n.x*.8+n.y*.3);
        vec3 color=vec3(.86,.91,.96)*band*reflect;
        float antenna=1.-smoothstep(1.25,1.8,abs(abs(p.y)-H*.39));
        if(p.x>W-5.)color=mix(color,vec3(.39,.42,.44),antenna*.85);
        // A side-key inset on the stationary body's outside rail.
        if(!moving&&p.x>W-.2&&p.y>38.&&p.y<77.&&depth>.22&&depth<.78)color*=.48;
        return color;
      }
      void candidate(float t,vec3 n,vec3 o,vec3 d,inout float nearest,inout vec3 hitNormal){
        if(t<=.0001||t>=nearest)return;
        vec3 p=o+d*t;
        if(p.z< -T-.001||p.z>.001)return;
        if(p.x<-.001||p.x>W+.001||abs(p.y)>H*.5+.001)return;
        // Plane portions exclude rounded corners, which the cylinders handle.
        float rr=p.x>W*.5?R:1.2;
        if(abs(n.x)>.5&&abs(p.y)>H*.5-rr)return;
        if(abs(n.y)>.5&&(p.x<1.2||p.x>W-R))return;
        nearest=t;hitNormal=n;
      }
      vec4 trace(vec3 eye,vec3 ray,vec3 axis,vec3 normal,vec3 hinge,bool moving,float sn,out float distance){
        vec3 delta=eye-hinge;
        vec3 o=vec3(dot(delta,axis),delta.y,dot(delta,normal));
        vec3 d=vec3(dot(ray,axis),ray.y,dot(ray,normal));
        float nearest=10000.;vec3 hitNormal=vec3(0.);

        resetMedia();status('浏览器无法读取这张照片，请尝试 JPG、PNG 或 WebP。',true);
      };
      image.src=state.objectURL;updatePlayback();invalidate();return;
    }
    // Mark a selected video before decoding so the visible play button is usable
    // even when a WebView waits for another tap before loading the first frame.
    state.source='video';videoWantsPlay=true;video.autoplay=true;
    let retriedWhenReady=false;
    video.onloadeddata=video.oncanplay=()=>{
      if(generation!==state.mediaGeneration) return;
      state.textureDirty=true;
      const seconds=Number.isFinite(video.duration)?Math.round(video.duration):0;
      $('mediaInfo').textContent=`${video.videoWidth} × ${video.videoHeight} / ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;
      if(!playbackBlocked)status();
      if(videoWantsPlay&&video.paused&&!playPending&&!retriedWhenReady){
        retriedWhenReady=true;requestVideoPlayback();
      }
      updatePlayback();invalidate();
    };
    video.onerror=()=>{
      if(generation!==state.mediaGeneration) return;
      resetMedia();$('mediaInfo').textContent='所选视频无法解码';
      status('浏览器无法播放此视频。请尝试 H.264 编码的 MP4，或在 Safari 中打开 HEVC 视频。',true);
    };
    video.src=state.objectURL; video.load();
    requestVideoPlayback();
    updatePlayback();invalidate();
  }
  function watchVideoFrames(){
    if(!('requestVideoFrameCallback' in video)||state.videoFramePending||destroyed)return;
    state.videoFramePending=true;
    video.requestVideoFrameCallback(()=>{state.videoFramePending=false;state.textureDirty=true;invalidate();if(!destroyed)watchVideoFrames();});
  }

  $('chooseVideo').addEventListener('click',()=>$('fileInput').click());
  $('fileInput').addEventListener('change',e=>{loadMedia(e.target.files?.[0]);e.target.value='';});
  $('resetMedia').addEventListener('click',resetMedia);
  function togglePlayback(){
    if(state.source==='loading'||state.source==='image')return;
    if(state.source==='video'){
      if(!state.playing){videoWantsPlay=true;video.autoplay=true;requestVideoPlayback();}
      else{
        videoWantsPlay=false;video.autoplay=false;playRequest++;playPending=false;
        video.pause();state.playing=false;status();
      }
    }else state.playing=!state.playing;
    state.lastTime=0;updatePlayback();invalidate();
  }
  $('playVideo').addEventListener('click',togglePlayback);
  $('quickPlayback').addEventListener('click',togglePlayback);
  for(const event of ['playing','pause','ended'])video.addEventListener(event,()=>{
    if(state.source!=='video')return;
    if(!videoWantsPlay&&!video.paused){video.pause();return;}
    state.playing=!video.paused&&video.readyState>=2;
    if(state.playing){playbackBlocked=false;status();}
    updatePlayback();invalidate();
  });
  // A bounded retry when WeChat finishes initializing its browser bridge.
  // An explicit pause always wins over readiness and lifecycle events.
  document.addEventListener('WeixinJSBridgeReady',()=>{
    if(videoWantsPlay&&video.paused&&!playPending)requestVideoPlayback();
  },{once:true});
  $('muteVideo').addEventListener('click',()=>{video.muted=!video.muted;updatePlayback();});
  $('fitMode').addEventListener('change',e=>{state.fit=e.target.value;invalidate();});
  $('angle').addEventListener('input',e=>setAngle(Number(e.target.value)));
  document.querySelectorAll('[data-angle]').forEach(b=>b.addEventListener('click',()=>animatePreset(Number(b.dataset.angle))));
  $('animateFold').addEventListener('click',playFold);
  $('glassEffect').addEventListener('change',e=>{state.effect=e.target.checked;invalidate();});
  // Recognize a double tap on pointer-up, inside the user activation window.
  // A drag, long press or second finger cancels tap recognition.
  canvas.addEventListener('pointerdown',e=>{
    if(!e.isPrimary){pointer=null;lastTap=null;return;}
    if(e.button!==0)return;
    stopAnimation();pointer={id:e.pointerId,x:e.clientX,y:e.clientY,time:performance.now(),angle:state.angle,moved:false};canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove',e=>{
    if(pointer?.id!==e.pointerId)return;
    if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>8)pointer.moved=true;
    if(pointer.moved){lastTap=null;setAngle(pointer.angle-(e.clientX-pointer.x)*180/(canvas.clientWidth*.65));}
  });
  canvas.addEventListener('pointerup',e=>{
    if(pointer?.id!==e.pointerId)return;
    const p=pointer,now=performance.now();pointer=null;
    if(p.moved||now-p.time>350){lastTap=null;return;}
    if(lastTap&&now-lastTap.time<320&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<26){lastTap=null;toggleFullscreen();}
    else lastTap={x:e.clientX,y:e.clientY,time:now};
  });
  canvas.addEventListener('pointercancel',()=>{pointer=null;lastTap=null;});
  canvas.addEventListener('lostpointercapture',()=>{pointer=null;});
  canvas.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setAngle(state.angle+(e.key==='ArrowLeft'?-1:1)*(e.shiftKey?15:3));}
    else if(e.key==='Home'){e.preventDefault();setAngle(0);}
    else if(e.key==='End'){e.preventDefault();setAngle(180);}
    else if(e.code==='Space'){e.preventDefault();playFold();}
    else if(e.key.toLowerCase()==='f'){e.preventDefault();toggleFullscreen();}
  });
  function syncFullscreen(){
    const native=!!(document.fullscreenElement||document.webkitFullscreenElement);
    document.body.classList.toggle('immersive',native||fallbackFullscreen);
    $('fullscreen').setAttribute('aria-label',native?'退出全屏':fallbackFullscreen?'退出沉浸模式':'进入全屏');
    $('fullscreen').setAttribute('aria-pressed',String(native||fallbackFullscreen));
    invalidate();
  }
  async function toggleFullscreen(){
    if(fullscreenBusy)return;
    fullscreenBusy=true;
    try{
      if(document.fullscreenElement||document.webkitFullscreenElement){
        await (document.exitFullscreen?document.exitFullscreen():document.webkitExitFullscreen());
      }else if(fallbackFullscreen){fallbackFullscreen=false;status();}
      else{
        const root=document.documentElement;
        try{
          if(root.requestFullscreen)await root.requestFullscreen({navigationUI:'hide'});
          else if(root.webkitRequestFullscreen)await root.webkitRequestFullscreen();
          else throw Error('Fullscreen unavailable');
          status();
        }catch{
          fallbackFullscreen=true;
          const notice='当前浏览器无法隐藏地址栏，已切换沉浸模式。再次双击可退出。';
          status(notice);
          window.setTimeout(()=>{if($('status').textContent===notice)status();},6000);
        }
      }
    }catch{status('暂时无法退出全屏，请使用浏览器的退出全屏按钮或 Esc 键。',true);}
    finally{fullscreenBusy=false;syncFullscreen();}
  }
  $('fullscreen').addEventListener('click',toggleFullscreen);
  document.addEventListener('fullscreenchange',syncFullscreen);
  document.addEventListener('webkitfullscreenchange',syncFullscreen);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&fallbackFullscreen){fallbackFullscreen=false;status();syncFullscreen();}});
  $('openSettings').addEventListener('click',()=>{settings.showModal();});
  $('closeSettings').addEventListener('click',()=>settings.close());
  settings.addEventListener('click',e=>{const r=settings.getBoundingClientRect();if(e.target===settings&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))settings.close();});
  let dragDepth=0;
  $('viewer').addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;$('viewer').classList.add('drag-over');});
  $('viewer').addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';});
  $('viewer').addEventListener('dragleave',()=>{if(--dragDepth<=0){dragDepth=0;$('viewer').classList.remove('drag-over');}});
  $('viewer').addEventListener('drop',e=>{e.preventDefault();dragDepth=0;$('viewer').classList.remove('drag-over');loadMedia(e.dataTransfer.files?.[0]);});
  document.addEventListener('dragover',e=>e.preventDefault());
  document.addEventListener('drop',e=>e.preventDefault());
  document.addEventListener('visibilitychange',()=>{state.lastTime=0;if(!document.hidden)invalidate();else if(state.frame){cancelAnimationFrame(state.frame);state.frame=0;}});
  new ResizeObserver(invalidate).observe($('viewer'));
  canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();destroyed=true;if(state.frame)cancelAnimationFrame(state.frame);state.frame=0;status('图形画面暂时中断，正在等待恢复。',true);});
  canvas.addEventListener('webglcontextrestored',()=>{try{destroyed=false;initializeRenderer();watchVideoFrames();status();invalidate();}catch{status('图形画面无法恢复，请刷新页面。',true);}});
  window.addEventListener('pagehide',()=>{playRequest++;playPending=false;video.pause();if(state.frame)cancelAnimationFrame(state.frame);state.frame=0;});
  window.addEventListener('pageshow',()=>{state.lastTime=0;if(videoWantsPlay&&video.paused)requestVideoPlayback();invalidate();});
  if(gl){try{initializeRenderer();watchVideoFrames();invalidate();}catch(error){console.error('Renderer initialization failed:',error);destroyed=true;$('canvasError').hidden=false;}}
  else{$('canvasError').hidden=false;}
  updatePlayback();

  const modelContext=document.modelContext;
  if(modelContext?.registerTool){
    const lifecycle=new AbortController();
    try{Promise.resolve(modelContext.registerTool({
      name:'set_fold_angle',title:'设置折叠角度',
      description:'Set the visible phone opening angle from 0 (closed) to 180 (open), stop automatic folding, and optionally enable or disable the frosted glass transition. Does not access or upload media.',
      inputSchema:{type:'object',properties:{angle:{type:'number',minimum:0,maximum:180},glassEffect:{type:'boolean'}},required:['angle'],additionalProperties:false},
      annotations:{readOnlyHint:false,untrustedContentHint:false},
      execute(input){if(!input||typeof input.angle!=='number'||!Number.isFinite(input.angle)||input.angle<0||input.angle>180||Object.keys(input).some(k=>!['angle','glassEffect'].includes(k))||(input.glassEffect!==undefined&&typeof input.glassEffect!=='boolean'))throw new Error('angle must be between 0 and 180; glassEffect must be boolean.');
        if(input.glassEffect!==undefined){state.effect=input.glassEffect;$('glassEffect').checked=state.effect;}
        setAngle(input.angle);return {angle:state.angle,glassEffect:state.effect};}
    },{signal:lifecycle.signal})).catch(()=>{});}catch{/* Browsers without the proposed API keep the same UI. */}
  }
})();

});</script>
</head>
<body>
<main class="viewer" id="viewer" aria-label="折叠手机体验">
<canvas id="screen" tabindex="0" aria-label="折叠手机：左右拖动开合，双击全屏；方向键调整，F 键切换全屏" aria-describedby="gestureHint"></canvas>
<div class="canvas-error" id="canvasError" hidden>无法启动图形加速，请使用支持 WebGL 的浏览器。</div>
<header class="topbar">
<div class="wordmark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 8h10v18H4zM18 8l10-4v18l-10 4z"/></svg><span>iDuo</span></div>
<div class="top-actions">
<button id="fullscreen" class="icon-button" aria-label="进入全屏" title="全屏 · 双击手机或按 F"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
<button id="openSettings" class="icon-button" aria-label="打开设置" aria-haspopup="dialog" aria-controls="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg></button>
</div>
</header>
<div class="view-label" id="viewLabel">内屏 · 完全展开</div>
<p class="rotate-hint">↻ 横屏观看，视野更大</p>
<div class="stage-bottom">
<p id="gestureHint" class="gesture-hint">拖动开合 · 双击全屏</p>
<div class="action-dock" role="group" aria-label="手机快捷操作">
<button class="choose-video" id="chooseVideo" aria-label="选择照片 / 视频" title="选择照片或视频，仅在本机使用"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 3-3 5 5"/></svg><span class="album-full">选择照片 / 视频</span><span class="album-short" aria-hidden="true">相册</span></button>
<div class="quick-controls">
<button class="quick-button" id="quickPlayback" aria-label="暂停画面"><span aria-hidden="true">Ⅱ</span><span>暂停</span></button>
<button class="quick-button active" data-angle="180" aria-pressed="true">展开</button>
<button class="quick-button" data-angle="0" aria-pressed="false">折叠</button>
</div>
</div>
<p class="privacy">照片和视频只在本机使用，不会上传</p>
<a class="repo-link" href="https://github.com/esolk/iphone-duo-fold-experience" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg><span class="repo-message">If you like iDuo, please give it a star on GitHub.</span><span class="repo-compact">Star on GitHub ↗</span></a>
</div>
<input type="file" id="fileInput" accept="image/*,video/*,.heic,.heif,.mov,.mp4,.m4v,.webm" hidden>
<p id="status" class="status" role="status" aria-live="polite"></p>
<div class="drop-cover" aria-hidden="true">松开，换成你的照片或视频</div>
</main>
<dialog class="controls" id="settings" aria-labelledby="settingsTitle">
<div class="panel-heading"><h1 id="settingsTitle">画面设置</h1><button id="closeSettings" class="icon-button" aria-label="关闭设置">×</button></div>
<div class="media-card"><div class="media-thumb" id="mediaThumb" aria-hidden="true"></div><div class="media-info"><strong id="mediaName">流光 · 内置演示</strong><span id="mediaInfo">动态色彩 / 循环播放</span></div><button class="icon-button" id="resetMedia" aria-label="恢复内置演示" title="恢复内置演示">↺</button></div>
<div class="media-controls"><button id="playVideo" class="small-button" aria-label="暂停画面">Ⅱ <span>暂停</span></button><button id="muteVideo" class="small-button" disabled aria-label="开启视频声音">♪ <span>已静音</span></button></div>
<label class="setting-row">画面适配<select id="fitMode" aria-label="画面适配"><option value="cover">铺满</option><option value="contain">完整</option></select></label>
<div class="divider"></div>
<div class="panel-heading"><h2>开合角度</h2><output id="angleValue" for="angle">180<span>°</span></output></div>
<input type="range" id="angle" min="0" max="180" step="0.1" value="180" aria-label="开合角度">
<div class="presets"><button data-angle="0">闭合</button><button data-angle="90">半折</button><button data-angle="180" class="active">展开</button></div>
<button class="animate-button" id="animateFold" aria-pressed="false"><span aria-hidden="true">▷</span><span id="animateText">播放开合动画</span></button>
<label class="setting-row" for="speed">播放速度<select id="speed"><option value="0.45">慢动作</option><option value="1" selected>正常</option><option value="1.5">快速</option></select></label>
<div class="divider"></div>
<label class="switch-row" for="glassEffect"><span>玻璃过渡</span><input type="checkbox" role="switch" id="glassEffect" checked><span class="switch-track" aria-hidden="true"></span></label>
<p class="panel-note">照片和视频只在本机使用，不会上传。</p>
<a class="reference" href="https://www.apple.com/iphone-duo/" target="_blank" rel="noopener noreferrer">动画参考 ↗</a>
<a class="repo-link panel-repo" href="https://github.com/esolk/iphone-duo-fold-experience" target="_blank" rel="noopener noreferrer">If you like iDuo, please give it a star on GitHub. ↗</a>
</dialog>
</body>
</html>
